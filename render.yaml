services:
  - type: web
    name: vmc-hmi-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      - key: CORS_ORIGIN
        sync: false
    disk:
      name: vmc-hmi-data
      mountPath: /var/data
      sizeGB: 1
